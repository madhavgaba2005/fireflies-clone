name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [meeting-service, ai-service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy app
      - name: Tests + coverage gate
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: backend/${{ matrix.service }}/coverage.xml

  event-contract:
    name: event contract identical in both services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envelope and payload schemas must be byte-identical in both services
        run: |
          for f in envelope_v1.schema.json payloads_v1.schema.json; do
            cmp "backend/meeting-service/tests/contract/$f" "backend/ai-service/tests/contract/$f"
          done

  kafka:
    name: kafka integration
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend/meeting-service
    steps:
      - uses: actions/checkout@v4
      - name: Start Kafka and the AI service (same config as local docker compose)
        working-directory: .
        run: docker compose up -d --build --wait kafka ai-service
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/meeting-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Real-broker tests (round trip + full pipeline through the AI service)
        run: pytest -m kafka -v
      - name: AI service logs
        if: failure()
        working-directory: .
        run: docker compose logs ai-service kafka

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # E2E runs against the real stack: Playwright starts both FastAPI services (HTTP
      # processing mode, freshly seeded SQLite) and a production build of the frontend.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/*/requirements*.txt
      - name: Install backend services for E2E
        working-directory: .
        run: |
          pip install -r backend/meeting-service/requirements.txt
          pip install -r backend/ai-service/requirements.txt
      - name: E2E (Playwright, critical workflows)
        env:
          E2E_PYTHON: python
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
