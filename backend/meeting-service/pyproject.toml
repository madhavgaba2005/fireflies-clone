# Tool configuration only — dependencies live in requirements*.txt.
[project]
name = "meeting-service"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # generated SQL strings
"app/seed/data.py" = ["E501"]  # prose transcript lines

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder holds migrations, not the package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["kafka: needs a running Kafka broker (deselected by default)"]
addopts = "-m 'not kafka'"
# A SQLAlchemy warning usually means data silently not saved — fail loudly instead.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]  # ships no type information
ignore_missing_imports = true
