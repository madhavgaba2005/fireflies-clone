# Production stack for a single VM: everything real, including Kafka.
#   cp deploy/.env.example deploy/.env   # then edit
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Only Caddy publishes ports; Kafka and the services are reachable on the internal network only.
name: lumen

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
      meeting-service:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: "" # same origin via Caddy
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m # fits small free-tier VMs
      KAFKA_LOG_DIRS: /var/lib/kafka/data # on a volume: in-flight events survive a broker restart
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  meeting-service:
    build: ../backend/meeting-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////data/meetings.db
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      PROCESSING_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SEED_ON_STARTUP: "true" # demo data on first start only
    volumes:
      - meeting-data:/data # SQLite lives here: survives restarts and redeploys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      kafka:
        condition: service_healthy

  ai-service:
    build: ../backend/ai-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PROCESSING_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SUMMARY_PROVIDER: mock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  meeting-data:
  kafka-data:
  caddy-data:
  caddy-config:
