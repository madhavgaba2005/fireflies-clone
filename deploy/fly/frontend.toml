# Frontend (Next.js standalone). Public: https://lumen-mg.fly.dev
# Deploy from the repo root:  flyctl deploy frontend --config ../deploy/fly/frontend.toml --ha=false
app = "lumen-mg"
primary_region = "sin"

[build.args]
  NEXT_PUBLIC_API_URL = "https://lumen-api-mg.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
