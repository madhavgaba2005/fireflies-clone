# Meeting Service (system of record) with SQLite on a Fly volume. Public API: https://lumen-api-mg.fly.dev
# Deploy from the repo root:
#   flyctl deploy backend/meeting-service --config deploy/fly/meeting-service.toml --dockerfile backend/meeting-service/Dockerfile.fly
app = "lumen-api-mg"
primary_region = "sin"

[env]
  ENVIRONMENT = "production"
  DATABASE_URL = "sqlite:////data/meetings.db"
  PROCESSING_MODE = "kafka"
  KAFKA_BOOTSTRAP_SERVERS = "lumen-kafka-mg.internal:9092"
  SEED_ON_STARTUP = "true"
  CORS_ORIGINS = "https://lumen-mg.fly.dev"

[mounts]
  source = "meeting_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: the outbox relay and the result consumer run inside this process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
