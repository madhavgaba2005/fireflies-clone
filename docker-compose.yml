# Local development stack: Kafka + both backend services.
# The frontend runs natively (`npm run dev`) for fast reloads — see README "Local Setup".
services:
  kafka:
    image: apache/kafka:3.9.1 # single-node KRaft (no ZooKeeper)
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      # Host tools connect to localhost:9092; containers connect to kafka:29092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # explicit topic creation arrives with the consumers (Phase 5)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  meeting-service:
    build: ./backend/meeting-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/meetings.db
      CORS_ORIGINS: http://localhost:3000
      PROCESSING_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SEED_ON_STARTUP: "true" # demo data on first start (no-op once meetings exist)
    volumes:
      - meeting-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      kafka:
        condition: service_healthy

  ai-service:
    build: ./backend/ai-service
    ports:
      - "8001:8001"
    environment:
      PROCESSING_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SUMMARY_PROVIDER: mock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  meeting-data:
